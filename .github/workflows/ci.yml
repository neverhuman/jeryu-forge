name: ci

on:
  pull_request:
  push:
    branches: [main]


permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # A GitHub-hosted runner has no governed jankurai. The full gate still
      # runs on a host that has /home/ubuntu/.jeryu/bin/jankurai.
      - name: PR CI (canonical gate)
        run: |
          set -euo pipefail
          governed="/home/ubuntu/.jeryu/bin/jankurai"
          if [[ -x "${governed}" && ! -L "${governed}" ]]; then
            bash ops/ci/ensure-jankurai.sh
            bash ops/ci/pr-ci.sh
          else
            printf '%s\n' "governed jankurai is absent on this runner; running hermetic portal lanes"
            bash ops/ci/fast.sh
            bash tools/security-lane.sh
            bash ops/ci/artifact_support.sh
          fi
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-audit-artifacts
          path: |
            .jankurai/
            target/jankurai/
            target/artifact-support/
          if-no-files-found: ignore
